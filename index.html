<style id="vuka-no-yellow">
  /* Kill all yellow badges */
  [style*="#FEF3C7"], [style*="#FEF08A"], [style*="#FDE68A"], [style*="#FFFBEB"], [style*="fef3c7"] {
    background: #EDE9FE !important;
    border-color: #DDD6FE !important;
    color: #6C5CE7 !important;
  }
  /* Target badges containing Avg loss, 18h, Bus factor */
  div:has(> :only-child) { }
  /* Direct override for any element with yellow-ish background */
  * {
    --tw-bg-opacity: 1;
  }
  /* Yellow lines - top and bottom borders of cards */
  div[style*="border"], section[style*="border"] {
    border-color: #EDE9FE !important;
  }
  /* Specific card yellow borders - override with violet */
  div[style*="border: 1px solid rgb(254"], div[style*="border:1px solid #FE"] {
    border-color: #EDE9FE !important;
  }
  /* Make the thin yellow lines at top/bottom of problem cards violet */
  .vuka-yellow-line-fix {
    border-top: 3px solid #8B5CF6 !important;
    border-bottom: 1px solid #EDE9FE !important;
  }
</style>
<script>
(function(){
  function killYellow(){
    document.querySelectorAll('*').forEach(function(el){
      var style = el.getAttribute('style')||'';
      var txt = (el.textContent||'');
      // Badges
      if(txt.includes('Avg loss:') || txt.includes('wasted weekly') || txt.includes('Bus factor')){
        el.style.background = '#EDE9FE';
        el.style.backgroundColor = '#EDE9FE';
        el.style.borderColor = '#DDD6FE';
        el.style.color = '#6C5CE7';
        el.style.borderWidth = '1px';
        el.style.borderStyle = 'solid';
      }
      // Yellow backgrounds
      if(style.includes('#FEF3C7') || style.includes('#FEF08A') || style.includes('#FDE68A') || style.includes('254, 243, 199') || style.includes('254,240,138')){
        el.style.background = '#EDE9FE';
        el.style.backgroundColor = '#EDE9FE';
        el.style.borderColor = '#DDD6FE';
        el.style.color = '#6C5CE7';
      }
      // Yellow lines - cards with yellow border top
      if(style.includes('border') && (style.includes('254, 243') || style.includes('253, 230') || style.includes('#FEF') || style.includes('#FDE'))){
        el.style.borderColor = '#EDE9FE';
        el.style.borderTopColor = '#8B5CF6';
      }
      // Specific: elements that have yellow border as thin line at top of problem cards
      var cs = window.getComputedStyle(el);
      if(cs.borderTopColor === 'rgb(254, 243, 199)' || cs.borderTopColor === 'rgb(253, 230, 138)' || cs.borderBottomColor === 'rgb(254, 243, 199)'){
        el.style.borderTopColor = '#8B5CF6';
        el.style.borderBottomColor = '#EDE9FE';
        el.style.borderLeftColor = '#EDE9FE';
        el.style.borderRightColor = '#EDE9FE';
      }
      if(cs.backgroundColor === 'rgb(254, 243, 199)' || cs.backgroundColor === 'rgb(254, 249, 195)' || cs.backgroundColor === 'rgb(255, 251, 235)'){
        el.style.backgroundColor = '#EDE9FE';
        el.style.color = '#6C5CE7';
        el.style.borderColor = '#DDD6FE';
      }
    });
    // Also fix any element with inline style containing yellow via CSSOM
    var all = document.querySelectorAll('div');
    all.forEach(function(card){
      // check if card looks like problem card (has Avg loss or similar inside)
      if(card.textContent && (card.textContent.includes('Leads slipping') || card.textContent.includes('Spreadsheet hell') || card.textContent.includes('Ops held'))){
        card.style.borderColor = '#EDE9FE';
        card.style.borderTop = '3px solid #8B5CF6';
      }
    });
  }
  setTimeout(killYellow, 600);
  setTimeout(killYellow, 1500);
  setInterval(killYellow, 2000);
  window.addEventListener('load', function(){ setTimeout(killYellow, 600); });
})();
</script>
